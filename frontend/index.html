<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Demo - Shopping Cart🛒</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
        <div class="container">
            <a href="#" class="navbar-brand fw-bold">
                Shop demo
            </a>
            <div class="d-flex gap-2 align-items-center">
                <button 
                    class="btn btn-outline-dark position-relative"
                    data-bs-toggle="offcanvas" 
                    data-bs-target="#cartOffcanvas"
                    aria-controls="cartOffcanvas">
                    🛒 Carrito
                    <span id="cartCount" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="row g-3 align-items-end mb-4">
            <div class="col-12 col-md-6">
                <h1 class="h3 mb-1">Productos</h1>
                <p class="text-muted mb-0">
                    Carrito Responsive + Firebase + Stripe + Cloudinary
                </p>
            </div>
            
            <div class="col-12 col-md-6">
                <div class="d-flex gap-2 justify-content-md-end">
                    <input id="searchInput" 
                        class="form-control"
                        placeholder="Buscar producto...">
                    
                    <select id="sortSelect" class="form-select" style="max-width: 200px;">
                        <option value="name_asc">Nombre (A-Z)</option>
                        <option value="price_asc">Precio (Menor-Mayor)</option>
                        <option value="price_desc">Precio (Mayor-Menor)</option>            
                    </select>
                </div>
            </div>
        </div>

        <div id="productsGrid" class="row g-3"></div>
        
        <div id="emptyState" class="text-center py-5 d-none">
            <div class="display-6">⚠️</div>
            <p class="text-muted mt-2">No hay productos para mostrar.</p>
        </div>
    </main>
    
    <div class="offcanvas offcanvas-end" tabindex="-1" id="cartOffcanvas" aria-labelledby="cartOffcanvasLabel">
        <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title" id="cartOffcanvasLabel">Tu Carrito</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column gap-3">
            <div id="cartItems" class="d-flex flex-column gap-2"></div>
            
            <div id="cartEmpty" class="text-center text-muted small d-none">
                Tu carrito está vacío
            </div>
            
            <div class="mt-auto border-top pt-3">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="fw-semibold">Total</span>
                    <span id="cartTotal" class="fw-bold h5 mb-0">$0</span>
                </div>

                <button id="checkoutBtn" class="btn btn-primary w-100 mb-2">
                    Pagar 💵
                </button>

                <button id="clearCartBtn" class="btn btn-outline-danger w-100">
                    Vaciar Carrito 🗑️
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./js/app.js"></script>
</body>
</html>
